name: Godot project tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          wget -q --tries=3 -O "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.4.1-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

      - name: Find project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find . -type f -name project.godot -not -path '*/.godot/*' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "::error::project.godot not found. Upload the extracted project first."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          Godot_v4.4.1-stable_linux.x86_64 \
            --headless --editor --path "$PROJECT_DIR" --import

      - name: Test all 50 stages
        run: |
          Godot_v4.4.1-stable_linux.x86_64 \
            --headless --path "$PROJECT_DIR" \
            --script res://tests/verify.gd

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maze-test-results
          path: '**/tests/results.json'
          if-no-files-found: warn
