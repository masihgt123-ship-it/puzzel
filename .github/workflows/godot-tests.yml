name: Build Godot Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 platforms;android-34

      - name: Setup Godot Engine
        uses: abarrak/godot-action@v2
        with:
          version: 4.4.1
          use-templates: true

      - name: Export Godot Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/puzzel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzel-apk
          path: build/android/puzzel.apk
