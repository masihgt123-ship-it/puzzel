name: Build Android Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      GODOT_VERSION: 4.4.1
      XDG_CONFIG_HOME: /home/runner/.config

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Find the Godot project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          projects = [
              p for p in Path('.').rglob('project.godot')
              if '.godot' not in p.parts and '.git' not in p.parts
          ]

          if len(projects) != 1:
              raise SystemExit(
                  f'Expected exactly one extracted Godot project; found {len(projects)}. '
                  'Upload the project files, not just a ZIP.'
              )

          root = projects[0].parent.resolve()

          if not (root / 'export_presets.cfg').is_file():
              preset = '''[preset.0]
          name="Android"
          platform="Android"
          runnable=true
          export_filter="all_resources"
          include_filter=""
          exclude_filter="tests/*,README*,LICENSE-NOTICE.md,.github/*"
          export_path="builds/maze-debug.apk"
          script_export_mode=2

          [preset.0.options]
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=true
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="org.mazemusic.game"
          package/name="Maze Music"
          package/signed=true
          keystore/debug=""
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          permissions/internet=false
          '''
              (root / 'export_presets.cfg').write_text(
                  preset, encoding='utf-8'
              )
              print('Created missing Android export preset')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'PROJECT_DIR={root}\n')

          print(f'Project: {root}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          curl --fail --location --retry 3 \
            "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot-bin"

          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot-bin"

          mv \
            "$RUNNER_TEMP/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "$RUNNER_TEMP/godot-bin/godot"

          chmod +x "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

          curl --fail --location --retry 3 \
            "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"

          unzip -j -q "$RUNNER_TEMP/templates.tpz" \
            'templates/android_debug.apk' \
            'templates/android_release.apk' \
            -d "$TEMPLATE_DIR"

          rm "$RUNNER_TEMP/templates.tpz"

      - name: Configure SDK and temporary debug signing
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/android-signing"

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/android-signing/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sdk = (
              os.environ.get('ANDROID_HOME')
              or os.environ.get('ANDROID_SDK_ROOT')
          )

          if not sdk:
              raise SystemExit('Android SDK path is missing')

          java = os.environ['JAVA_HOME']
          settings = Path(os.environ['XDG_CONFIG_HOME']) / 'godot'
          settings.mkdir(parents=True, exist_ok=True)

          (settings / 'editor_settings-4.4.tres').write_text(
              '[gd_resource type="EditorSettings" format=3]\n\n'
              '[resource]\n'
              'export/android/android_sdk_path = '
              + json.dumps(sdk) + '\n'
              'export/android/java_sdk_path = '
              + json.dumps(java) + '\n',
              encoding='utf-8'
          )

          preset = Path(os.environ['PROJECT_DIR']) / 'export_presets.cfg'
          text = preset.read_text(encoding='utf-8')
          key = 'keystore/debug=""'

          if key not in text:
              raise SystemExit(
                  'Expected the supplied Android preset '
                  'with an empty debug keystore path'
              )

          keystore = str(
              Path(os.environ['RUNNER_TEMP'])
              / 'android-signing/debug.keystore'
          )

          preset.write_text(
              text.replace(
                  key,
                  'keystore/debug=' + json.dumps(keystore),
                  1
              ),
              encoding='utf-8'
          )
          PY

      - name: Fix Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ['PROJECT_DIR'])

          preset = root / 'export_presets.cfg'
          text = preset.read_text(encoding='utf-8')

          if not re.search(r'^include_filter\s*=', text, re.M):
              text = text.replace(
                  '[preset.0]',
                  '[preset.0]\ninclude_filter=""',
                  1
              )

          preset.write_text(text, encoding='utf-8')

          project = root / 'project.godot'
          text = project.read_text(encoding='utf-8')

          key = 'textures/vram_compression/import_etc2_astc'
          pattern = r'^' + re.escape(key) + r'\s*=.*$'

          if re.search(pattern, text, re.M):
              text = re.sub(
                  pattern,
                  key + '=true',
                  text,
                  flags=re.M
              )
          elif '[rendering]' in text:
              text = text.replace(
                  '[rendering]',
                  '[rendering]\n' + key + '=true',
                  1
              )
          else:
              text += '\n[rendering]\n' + key + '=true\n'

          project.write_text(text, encoding='utf-8')

          print(
              'Enabled Android texture imports '
              'and completed export preset'
          )
          PY

      - name: Import resources
        run: godot --headless --editor --path "$PROJECT_DIR" --import

      - name: Test all 50 stages
        run: godot --headless --path "$PROJECT_DIR" --script res://tests/verify.gd

      - name: Build and verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/builds"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/builds/maze-debug.apk"

          test -s "$PROJECT_DIR/builds/maze-debug.apk"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          "$SDK/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$PROJECT_DIR/builds/maze-debug.apk"

          (
            cd "$PROJECT_DIR/builds"
            sha256sum maze-debug.apk > maze-debug.apk.sha256
          )

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: maze-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/builds/maze-debug.apk
            ${{ env.PROJECT_DIR }}/builds/maze-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-test-results
          path: '${{ env.PROJECT_DIR }}/tests/results.json'
          if-no-files-found: warn
